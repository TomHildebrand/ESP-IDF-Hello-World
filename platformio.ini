; PlatformIO Project Configuration File
;
; Board definitions (hardware types + inventory of physical modules) come from the
; shared esp32-boards repo, included as a git submodule at boards/:
;   boards/boards.ini        [hw_*] hardware types, [env:mNN_*] physical modules
;   boards/include/board.h   pins + capabilities per hardware type
; Don't edit those here - change them in esp32-boards and update the submodule.
;
; Select a module with the env picker in the VS Code status bar, or on the CLI:
;   pio run -e m15_esp32s3 -t upload -t monitor
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = boards/boards.ini
; Modules this project is normally built for (plain "pio run").
default_envs = m12_doit_esp32
; Keep build output OUTSIDE OneDrive: syncing thousands of churning build files
; causes locked/vanishing object files and broken links.
build_dir = C:/pio-build/ESP-IDF-Hello-World

[boards]
; Location of the esp32-boards submodule, relative to this project
dir = boards

; ===== app settings, shared by every module ===================================
[env]
framework = espidf
; App-wide flags, appended to each module's board flags
build_flags =
lib_deps =

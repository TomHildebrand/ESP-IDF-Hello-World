; PlatformIO Project Configuration File
;
; One [env:mNN_...] per physical module. Select it with the env picker in the VS Code
; status bar, or on the CLI:   pio run -e m15_esp32s3 -t upload -t monitor
;
; Layout:
;   [env]            settings shared by every board
;   [hw_*]           hardware variants (board definition, memory, sdkconfig defaults)
;   [env:mNN_*]      one per physical module: extends a hw_* section + its COM port
;
; Board-specific pins/constants live in include/board.h (selected by -DBOARD_xxx).
; ESP-IDF settings per hardware variant live in sdkconfig.defaults.<variant>.
; NOTE: sdkconfig defaults are only applied when sdkconfig.<env> is (re)generated –
;       after editing a defaults file, delete the matching sdkconfig.<env> file(s).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m12_doit_esp32
; Keep build output OUTSIDE OneDrive: syncing thousands of churning build files
; causes locked/vanishing object files and broken links.
build_dir = C:/pio-build/ESP-IDF-Hello-World

; ===== shared by all boards ===================================================
[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

; ===== hardware variants ======================================================

; DOIT ESP32 DEVKIT V1 - ESP32-WROOM-32, 4 MB quad flash, no PSRAM
[hw_doit_esp32]
board = esp32doit-devkit-v1
build_flags = -DBOARD_DOIT_ESP32_DEVKIT_V1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32_4mb"

; 38-pin ESP32 DEVKIT V1 clone with ESP32-WROOM-32U: EXTERNAL antenna (U.FL),
; NO user LED (only the red power LED). Same memory/sdkconfig as above.
; (verified with esptool on Module 12: ESP32-D0WD-V3, 4 MB flash, no PSRAM)
[hw_esp32_devkit38_wroom32u]
extends = hw_doit_esp32
build_flags = -DBOARD_ESP32_DEVKIT_V1_38PIN -DBOARD_ANTENNA_EXTERNAL=1

; ESP32-S3-DevKitC-1 N16R8 - WROOM-1: 16 MB QUAD flash (3.3 V) + 8 MB octal PSRAM
; (verified with esptool on Modules 14-18: "Flash type set in eFuse: quad", 3.3 V)
[hw_s3_devkitc_n16r8]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = -DBOARD_S3_DEVKITC1_N16R8
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.s3_n16r8"

; ESP32-S3-DevKitC-1U N16R8 - WROOM-1U: same as above, but EXTERNAL antenna (U.FL)
; instead of the PCB antenna. Electrically identical, same sdkconfig.
[hw_s3_devkitc_n16r8u]
extends = hw_s3_devkitc_n16r8
build_flags = ${hw_s3_devkitc_n16r8.build_flags} -DBOARD_ANTENNA_EXTERNAL=1

; ESP32-S3-DevKitC-1 N32R16V - WROOM-2: 32 MB OCTAL flash (1.8 V) + 16 MB octal PSRAM
[hw_s3_devkitc_n32r16v]
board = esp32-s3-devkitc-1
board_build.flash_mode = dout
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
build_flags = -DBOARD_S3_DEVKITC1_N32R16V
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.s3_n32r16v"

; LILYGO T-SIM7080G-S3 - ESP32-S3-WROOM-1-N16R8 + SIM7080G modem, variant WITHOUT PMU.
; No USB-UART chip: upload/console over the S3's native USB (USB-Serial-JTAG).
[hw_lilygo_tsim7080g_s3]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = -DBOARD_LILYGO_T_SIM7080G_S3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.s3_n16r8;sdkconfig.defaults.usb_console"

; ===== physical modules =======================================================

[env:m12_doit_esp32]
extends = hw_esp32_devkit38_wroom32u
build_flags = ${hw_esp32_devkit38_wroom32u.build_flags} -DBOARD_MODULE_ID=12
upload_port = COM4
monitor_port = COM4

[env:m14_esp32s3]
extends = hw_s3_devkitc_n16r8
build_flags = ${hw_s3_devkitc_n16r8.build_flags} -DBOARD_MODULE_ID=14
upload_port = COM10
monitor_port = COM10

[env:m15_esp32s3]
extends = hw_s3_devkitc_n16r8
build_flags = ${hw_s3_devkitc_n16r8.build_flags} -DBOARD_MODULE_ID=15
upload_port = COM7
monitor_port = COM7

[env:m16_esp32s3]
extends = hw_s3_devkitc_n16r8
build_flags = ${hw_s3_devkitc_n16r8.build_flags} -DBOARD_MODULE_ID=16
upload_port = COM9
monitor_port = COM9

[env:m17_esp32s3]
extends = hw_s3_devkitc_n16r8u
build_flags = ${hw_s3_devkitc_n16r8u.build_flags} -DBOARD_MODULE_ID=17
upload_port = COM12
monitor_port = COM12

[env:m18_esp32s3]
extends = hw_s3_devkitc_n16r8u
build_flags = ${hw_s3_devkitc_n16r8u.build_flags} -DBOARD_MODULE_ID=18
upload_port = COM13
monitor_port = COM13

[env:m19_esp32s3]
extends = hw_s3_devkitc_n32r16v
build_flags = ${hw_s3_devkitc_n32r16v.build_flags} -DBOARD_MODULE_ID=19
upload_port = COM16                    ; native USB port (USB-Serial-JTAG, not the UART port)
monitor_port = COM16
; console on native USB-Serial-JTAG, since this module is used via its USB port
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.s3_n32r16v;sdkconfig.defaults.usb_console"

[env:m20_lilygo_sim7080g]
extends = hw_lilygo_tsim7080g_s3
build_flags = ${hw_lilygo_tsim7080g_s3.build_flags} -DBOARD_MODULE_ID=20
; COM port not known yet - set upload_port / monitor_port once it is plugged in
